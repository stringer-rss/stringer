version: '3'

services:
  stringer-postgres:
    image: postgres:18-alpine
    container_name: stringer-postgres
    restart: always
    networks:
      - stringer-network
    volumes:
      # Postgres 18+ images expect a single mount here and store the database
      # in a version-named subdirectory. See docs/Docker.md for upgrade steps.
      - /srv/stringer/data:/var/lib/postgresql
    # The database is only reachable on stringer-network, so a default
    # password is fine. Set POSTGRES_PASSWORD in .env to change it.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stringer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stringer}
      POSTGRES_DB: ${POSTGRES_DB:-stringer}

  stringer:
    image: stringerrss/stringer:latest
    container_name: stringer
    build: .
    depends_on:
      stringer-postgres:
        condition: service_started
    restart: always
    ports:
      - 80:8080
    networks:
      - stringer-network
    volumes:
      # On boot the app writes any missing secret keys to this file.
      - ./.env:/app/.env
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-stringer}:${POSTGRES_PASSWORD:-stringer}@${POSTGRES_HOSTNAME:-stringer-postgres}/${POSTGRES_DB:-stringer}}

networks:
  stringer-network:
    external: false
    name: stringer-network
